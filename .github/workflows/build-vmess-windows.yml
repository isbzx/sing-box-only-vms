name: build sing-box vmess windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build minimal sing-box (vmess only)
        env:
          CGO_ENABLED: 0
        run: |
          go build ^
            -trimpath ^
            -ldflags "-s -w" ^
            -tags "with_vmess,with_socks,with_http,with_log,with_dns" ^
            -o sing-box-vmess.exe ^
            ./cmd/sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-vmess-windows
          path: sing-box-vmess.exe
